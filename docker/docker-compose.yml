# ============================================================================
# Incident Management System - local / single-host deployment
#
# Run from this docker/ directory:
#
#   docker compose up -d --build
#
# Services share Compose's default bridge network, so the backend reaches
# MySQL via the hostname "mysql". MySQL data persists in the named volume
# "ims-mysql-data".
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # MySQL 8.4 database
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: ims-mysql
    environment:
      MYSQL_DATABASE: imsdb
      MYSQL_USER: ims
      # No baked-in credentials: set these in docker/.env (see .env.example)
      # or the shell environment. Compose refuses to start without them.
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env or the environment}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in docker/.env or the environment}
    volumes:
      - ims-mysql-data:/var/lib/mysql
    # The backend talks to MySQL over the internal compose network; this host
    # port mapping exists ONLY so you can inspect the DB from your machine
    # (e.g. MySQL Workbench / mysql CLI on localhost:3306). Remove it for a
    # locked-down deployment - nothing in this stack needs it.
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ims", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Spring Boot backend
  # --------------------------------------------------------------------------
  backend:
    build:
      # Context is the repo root so the Dockerfile can COPY backend/...
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ims-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: imsdb
      DB_USER: ims
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env or the environment}
      # Base64-encoded HMAC key (>= 32 bytes decoded), required for JWT signing.
      # No default on purpose: a fallback key in a public repo would let anyone
      # forge tokens. Generate one:  openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env or the environment (openssl rand -base64 64)}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # React frontend - Vite build served by nginx, which also proxies /api to
  # the backend service (the SPA uses a relative /api base, so the app is
  # same-origin and needs no build-time API URL). Open http://localhost:3000
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ims-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  ims-mysql-data:

# nginx config for the containerized SPA (see Dockerfile).
# - Serves the Vite build with history-API fallback for client-side routing.
# - Proxies /api to the backend service on the compose network, keeping the
#   app same-origin (no CORS in play for the containerized deployment).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # REST API → Spring Boot ("backend" = compose service name)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback: every other path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
